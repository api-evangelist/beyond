notes: >-
  Bearer-protected API. Partners use OAuth2 client-credentials to mint app tokens and may
  scope tokens to a user via user_id / credential_id. Individual users paste a personal
  access token prefixed `bpat_...` in the same Bearer header. The authorization-server
  metadata (well-known/beyond-oauth-authorization-server.json) additionally advertises
  authorization_code, device_code and refresh_token grants with PKCE S256; the MCP server
  (neyoba:ask scope) uses the authorization_code + PKCE flow with dynamic client registration.
