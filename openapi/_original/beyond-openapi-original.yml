          type:
          - string
          - 'null'
          description: Human-readable reason for the factor (e.g., event name)
        event-impact:
          type:
          - string
          - 'null'
          description: 'Event impact level: ''low'', ''medium'', or ''high''. Only
            present for event factors.'
