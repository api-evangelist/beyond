                * `rejected` - Rejected
                * `expired` - Expired
                * `canceled` - Canceled
                * `outdated` - Outdated
            approved-at:
              type:
              - string
              - 'null'
              format: date-time
            rejected-at:
              type:
              - string
              - 'null'
              format: date-time
            expired-at:
              type:
              - string
              - 'null'
              format: date-time
            suggested-base-price:
              type:
              - integer
              - 'null'
              description: Suggested base price for the listing.
            suggested-min-price:
              type:
              - integer
              - 'null'
              description: Suggested minimum price for the listing.
            suggested-seasonal-min-price-pct:
              type:
              - number
              - 'null'
              format: double
              description: Suggested seasonal minimum price adjustment percentage.
            initial-base-price:
              type:
              - integer
              - 'null'
              description: Base price recorded when the recommendation was created.
            initial-min-price:
              type:
              - integer
              - 'null'
              description: Minimum price recorded when the recommendation was created.
            recommendations:
              type:
              - string
              - 'null'
              description: Recommendations about the listing from the booking review
            category:
              enum:
              - min_price
              - seasonal_min_price
              - base_price
              - strategy
              - enable_listing
              - gap_fill
              - ''
              - null
              type:
              - string
              - 'null'
              description: |-
                Category of the booking review

                * `min_price` - Min_Price
                * `seasonal_min_price` - Seasonal_Min_Price
                * `base_price` - Base_Price
                * `strategy` - Strategy
                * `enable_listing` - Enable_Listing
                * `gap_fill` - Gap_Fill
            created-at:
              type: string
              format: date-time
              readOnly: true
          required:
          - listing-title
