          type:
          - string
          - 'null'
          description: ISO 4217 currency code of the previous base price. Differs
            from new-currency only when this change is a currency re-denomination;
            equal to new-currency for a plain price change.
        changed-at:
          type:
          - string
          - 'null'
          format: date-time
          description: UTC timestamp when the base price changed (RFC 3339).
        channel-listings:
          type: array
          items:
            $ref: '#/components/schemas/ListingBasePriceChangedEventChannelListings'
          description: The listing's active channel listings — one entry per channel
            the listing is syndicated to, mirroring channel-listings on the listing
            resource. Empty on a listing with no active channel listing.
        enabled:
          type: boolean
          description: Whether the listing has pricing enabled. true means the price
            change is live; false means it is speculative — e.g. a change to the algorithm's
            computed starting price on a listing that is not yet enabled, or a user
            editing the base price before turning syncing on.
        change-source:
          enum:
          - user
          - system
          type: string
          description: |-
            What moved the base price. 'user' — an authenticated actor (the Partners API, the Beyond app, or an admin). 'system' — an automatic process (Beyond's algorithm computing a starting price, a scheduled auto-approved booking review, a background job). A change to the computed starting price is always 'system'.

