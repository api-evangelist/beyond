  /api/v1/users/{user_id}/market-insights/:
    get:
      operationId: get_market_insights
      description: |-
        Retrieve aggregated market insights for a specific user.

        **Required scope:** `insights:read`

        **Filters:** Use `filter[markets]`, `filter[clusters]`, `filter[cities]`,
        `filter[bedrooms]`, `filter[start-date]`, `filter[end-date]`, and
        `filter[currency]`
        query parameters.

        **Example:** `GET /api/v1/users/42/market-insights/?filter[markets]=San Francisco&filter[currency]=USD`
      summary: Get market insights for a user
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      - name: page[number]
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page[size]
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: filter[markets]
        schema:
          type: string
        description: Comma-separated market names to filter by. At least one of filter[markets],
          filter[clusters], or filter[cities] is required.
      - in: query
        name: filter[clusters]
        schema:
          type: string
        description: Comma-separated cluster names to filter by. At least one of filter[markets],
          filter[clusters], or filter[cities] is required.
      - in: query
        name: filter[cities]
        schema:
          type: string
        description: Comma-separated city names to filter by. At least one of filter[markets],
          filter[clusters], or filter[cities] is required.
      - in: query
        name: filter[bedrooms]
        schema:
          type: string
        description: Comma-separated bedroom counts to filter by.
      - in: query
        name: filter[start-date]
        schema:
          type: string
          format: date
        description: Start date (YYYY-MM-DD) used for both check-in and booked filters.
          Defaults to today - 365 days.
      - in: query
        name: filter[end-date]
        schema:
          type: string
          format: date
        description: End date (YYYY-MM-DD) used for both check-in and booked filters.
          Defaults to today + 365 days.
      - in: query
        name: filter[currency]
        schema:
          type: string
        description: Currency code for prices (e.g. USD, EUR). Defaults to user's
          billing currency.
      - in: query
        name: fields[market-insights]
        schema:
          type: array
          items:
            type: string
            enum:
            - id
            - date
            - availability
            - added-listing-count
            - listing-count
            - canceled-count-by-stay-date
            - canceled-count-by-booked-date
            - canceled-count-by-canceled-date
            - total-count-by-stay-date
            - total-count-by-booked-date
            - checkin-date-count
            - volume-by-checkin-date
            - billable-volume-by-checkin-date
            - sum-lead-time
            - sum-stay-length
            - median-lead-time
            - median-stay-length
            - booked-at-count
            - volume-by-booked-at
            - billable-volume-by-booked-at
            - volume
            - week-ago-volume
            - year-ago-volume
            - two-years-ago-volume
            - three-years-ago-volume
            - four-years-ago-volume
            - five-years-ago-volume
            - six-years-ago-volume
            - billable-volume
            - year-ago-billable-volume
            - two-years-ago-billable-volume
            - three-years-ago-billable-volume
            - four-years-ago-billable-volume
            - five-years-ago-billable-volume
            - six-years-ago-billable-volume
            - occupied-days-count
            - week-ago-occupied-days-count
            - year-ago-occupied-days-count
            - two-years-ago-occupied-days-count
            - three-years-ago-occupied-days-count
