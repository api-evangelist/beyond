    AccountCreatedEventAttributes:
      type: object
      description: |-
        Dasherizes field names on output and un-dasherizes on input.

        Apply to nested (non-resource) serializers so their keys match
        the top-level JSON:API dasherized format. Top-level resource
        serializers must NOT use this mixin (the renderer handles them).
      properties:
        status:
          enum:
          - succeeded
          - failed
          type: string
          description: |-
            Terminal outcome of the initial listing sync. 'succeeded' means every listing on the account synced without error; 'failed' means at least one listing failed, or the sync itself did not complete.

            * `succeeded` - succeeded
            * `failed` - failed
        completed-at:
          type: string
          format: date-time
          description: UTC timestamp when the sync reached its terminal state (RFC
            3339)
        channel:
          type: string
          description: Channel the account is connected to (e.g. 'airbnb', 'hostaway').
        nb-listings-synced:
          type: integer
          description: Number of listings successfully created (or, for a revived
            account, restored) on this account by the sync.
        nb-listings-failed:
          type:
          - integer
          - 'null'
          description: Number of listings the sync could not create. Always present;
            0 when status='succeeded'. It is null when the sync did not run to completion
            (for example an infrastructure failure or a channel-wide error), so the
            per-listing count is unknown — in that case nb-listings-synced reports
            how many listings exist on the account, and status is 'failed'.
        error:
          type:
          - string
          - 'null'
          description: Short, human-readable failure description. Present only when
            status='failed'. Stable across retries of the same delivery.
      required:
