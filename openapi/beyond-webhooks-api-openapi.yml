      - channel-id
    _Relationship:
      type: object
      description: 'Generic JSON:API to-one relationship — ``{data: {type, id}, links?}``.'
      properties:
        data:
          $ref: '#/components/schemas/_RelationshipData'
        links:
          $ref: '#/components/schemas/_RelationshipLinks'
      required:
      - data
    ListingCreatedEventData:
      type: object
      description: 'Dasherizes field names on output and un-dasherizes on input.


        Apply to nested (non-resource) serializers so their keys match

        the top-level JSON:API dasherized format. Top-level resource

        serializers must NOT use this mixin (the renderer handles them).'
      properties:
        type:
          type: string
          description: JSON:API resource type for this event
        id:
          type: string
          description: ULID event identifier (msg_<base32>), same as the webhook-id header. Stable across delivery retries; dedupe on it.
        attributes:
          $ref: '#/components/schemas/ListingCreatedEventAttributes'
        relationships:
          $ref: '#/components/schemas/ListingCreatedEventRelationships'
      required:
      - attributes
      - id
      - relationships
      - type
    AccountCreatedEventRelationships:
      type: object
      description: 'Dasherizes field names on output and un-dasherizes on input.


        Apply to nested (non-resource) serializers so their keys match

        the top-level JSON:API dasherized format. Top-level resource

        serializers must NOT use this mixin (the renderer handles them).'
      properties:
        user:
          $ref: '#/components/schemas/_Relationship'
        account:
          $ref: '#/components/schemas/_Relationship'
      required:
      - account
