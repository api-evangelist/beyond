    Factor:
      type: object
      description: 'Serializer for a pricing factor within a calendar entry.


        Factors represent the individual components that influence the final price

        (e.g., seasonality, day-of-week, events).'
      properties:
        key:
          type: string
          description: Factor identifier (e.g., 'seasonality', 'dow', 'event')
        order:
          type: integer
          description: Display order of the factor
        ratio:
          type: number
          format: double
          description: Factor's contribution as a ratio (e.g., -0.19 means -19%)
        amount:
          type: integer
          description: This factor's contribution to the modeled price, in the same currency units as `price`. Negative values lower the price. Factors whose effect rounds to less than 1 report 0. Amounts do not necessarily sum to (price - base price) because min/max price limits and final rounding are applied between factors and are not attributed to any single factor.
        reason:
          type:
          - string
          - 'null'
          description: Human-readable reason for the factor (e.g., event name)
        event-impact:
          type:
          - string
          - 'null'
          description: 'Event impact level: ''low'', ''medium'', or ''high''. Only present for event factors.'
      required:
      - amount
      - key
      - order
      - ratio
