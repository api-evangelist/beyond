aid: beyond
name: Beyond
description: >-
  Beyond (beyondpricing.com) is a revenue-management platform for short-term and vacation
  rental operators. Since 2013 it has helped hosts and property managers maximize revenue
  with AI-driven dynamic pricing, real-time market intelligence, competitive-set analysis,
  owner reporting and demand signals. Its Public API (OpenAPI 3.1, JSON:API v1.1) exposes
  listings, calendars, pricing recommendations, listing customizations, users, connected
  channel accounts, comp sets and market insights, secured with OAuth2 client credentials
  and bpat_ personal access tokens, plus Standard Webhooks and an official MCP server
  (Neyoba) for AI agents. Surfaced as a Bessemer Venture Partners portfolio company and
  enriched into the API Evangelist network.
